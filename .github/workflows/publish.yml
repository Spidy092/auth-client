name: Publish auth-client

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Test, build, and publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Token-based publish. Requires an npm Automation token stored as the
      # NPM_TOKEN repository secret (Settings -> Secrets and variables ->
      # Actions). This replaces trusted publishing, which requires a matching
      # OIDC "trusted publisher" to be configured on npmjs.com for this package.
      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
